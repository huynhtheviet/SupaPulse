name: SupaPulse Heartbeat

on:
  schedule:
    # Runs 3 times daily at 00:00, 08:00, and 16:00 UTC (07:00, 15:00, 23:00 UTC+7)
    - cron: '0 0,8,16 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

jobs:
  ping-supabase:
    name: Execute SupaPulse Ping
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run SupaPulse Heartbeat Script
        env:
          # Single project (legacy)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Multiple projects as a JSON array: [{"name":"app","url":"...","key":"..."}]
          SUPABASE_PROJECTS: ${{ secrets.SUPABASE_PROJECTS }}
          # Exposes numbered secrets (SUPABASE_URL_1, SUPABASE_KEY_1, SUPABASE_NAME_1, ...)
          # so new projects can be added without editing this workflow
          SUPAPULSE_SECRETS: ${{ toJSON(secrets) }}
        run: node scripts/keep_alive.js
